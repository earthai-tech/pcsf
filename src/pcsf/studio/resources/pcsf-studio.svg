<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>PCSF Studio</title>
  <!-- Uses only SVG Tiny features (no clipPath, no filters) so that
       Qt's renderer, browsers and icon converters draw it alike. -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#172038"/>
  <!-- resistivity cells (jet_r: red conductive, blue resistive) -->
  <rect x="36" y="76" width="46" height="44" fill="#1b2fd6"/>
  <rect x="82" y="76" width="46" height="44" fill="#1426b8"/>
  <rect x="128" y="76" width="46" height="44" fill="#2240e6"/>
  <rect x="174" y="76" width="46" height="44" fill="#1a36d0"/>
  <rect x="36" y="120" width="46" height="32" fill="#36c3d6"/>
  <rect x="82" y="120" width="46" height="32" fill="#f2a516"/>
  <rect x="128" y="120" width="46" height="32" fill="#e6e632"/>
  <rect x="174" y="120" width="46" height="32" fill="#3ad6c0"/>
  <rect x="36" y="152" width="46" height="32" fill="#8be06a"/>
  <rect x="82" y="152" width="46" height="32" fill="#c0140f"/>
  <rect x="128" y="152" width="46" height="32" fill="#f05a14"/>
  <rect x="174" y="152" width="46" height="32" fill="#6ee08a"/>
  <rect x="36" y="184" width="46" height="32" fill="#3fd9b0"/>
  <rect x="82" y="184" width="46" height="32" fill="#7fdc6e"/>
  <rect x="128" y="184" width="46" height="32" fill="#3fd0c2"/>
  <rect x="174" y="184" width="46" height="32" fill="#1f9de0"/>
  <!-- cell grid -->
  <g stroke="#172038" stroke-opacity="0.6" stroke-width="3">
    <line x1="82" y1="76" x2="82" y2="216"/>
    <line x1="128" y1="76" x2="128" y2="216"/>
    <line x1="174" y1="76" x2="174" y2="216"/>
    <line x1="36" y1="120" x2="220" y2="120"/>
    <line x1="36" y1="152" x2="220" y2="152"/>
    <line x1="36" y1="184" x2="220" y2="184"/>
  </g>
  <!-- sky: hides the cells above the topography -->
  <path fill="#172038"
        d="M30 60 L226 60 L226 88 L220 88 C206 92 190 84 168 82 C142 80 124 102 104 94 C84 86 62 84 36 98 L30 98 Z"/>
  <!-- topography and stations -->
  <path d="M36 98 C62 84 84 86 104 94 C124 102 142 80 168 82 C190 84 206 92 220 88"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <g fill="#ffffff">
    <path d="M66 69 L78 87 L54 87 Z"/>
    <path d="M128 72 L140 90 L116 90 Z"/>
    <path d="M186 63 L198 81 L174 81 Z"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="47.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
</svg>
