name: PCSF Studio installers

# Builds the PCSF Studio installers, checks each frozen bundle with
# its self-test, and attaches them to the GitHub release of a tag.
# Run by hand from the Actions tab to get the files as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest supported glibc, so that the
        # AppImage runs on more distributions.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[studio,emc,mare2dem]" pyinstaller

      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libfuse2 makeself
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build, self-test and package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python installers/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: pcsf-studio-${{ runner.os }}
          path: |
            dist/*setup.exe
            dist/*.AppImage
            dist/*-linux.sh
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*setup.exe
            dist/*.AppImage
            dist/*-linux.sh
