name: PCSF Studio installers

# Builds the PCSF Studio installers on Windows and Linux and checks
# each frozen bundle with its self-test. On the dev branch it runs
# when the Studio or the installers change (artifacts only).
#
# For a v* tag, a last job gathers the installers of both systems
# and creates ONE draft release of the tag, with the text of
# .github/release-notes/<tag>.md, the versioned installers, copies
# under fixed names (pcsf-studio-setup.exe, pcsf-studio-x86_64.AppImage,
# pcsf-studio-linux.sh: the documentation links to
# releases/latest/download/<fixed name>) and SHA256SUMS. Review the
# draft on GitHub and publish it.

on:
  push:
    tags: ["v*"]
    branches: [dev]
    paths:
      - "src/pcsf/studio/**"
      - "installers/**"
      - ".github/workflows/studio-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest supported glibc, so that the
        # AppImage runs on more distributions.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[studio,emc,mare2dem]" pyinstaller

      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libfuse2 makeself
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build, self-test and package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python installers/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: pcsf-studio-${{ runner.os }}
          path: |
            dist/*setup.exe
            dist/*.AppImage
            dist/*-linux.sh
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pcsf-studio-*
          path: dist
          merge-multiple: true
      - name: Fixed names and checksums
        run: |
          cd dist
          ls -l
          cp pcsf-studio-*-setup.exe pcsf-studio-setup.exe
          cp pcsf-studio-*-x86_64.AppImage pcsf-studio-x86_64.AppImage
          cp pcsf-studio-*-linux.sh pcsf-studio-linux.sh
          sha256sum pcsf-studio-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "No $notes; the draft gets a short text." >&2
            echo "pcsf $GITHUB_REF_NAME. See CHANGELOG.md." > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: Draft release with the installers
        uses: softprops/action-gh-release@v2
        with:
          name: pcsf ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          files: |
            dist/pcsf-studio-*
            dist/SHA256SUMS
