name: Coverage

# Test coverage of the whole package, PCSF Studio included (drawn
# offscreen), reported to Codecov for the README badge and kept as
# an artifact (coverage.xml).
#
# One-time setup: add the repository on https://codecov.io and store
# its upload token as the secret CODECOV_TOKEN.

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev,studio]"
      - name: Test with coverage
        run: >-
          pytest -q --cov=pcsf --cov-branch
          --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # a Codecov outage must not fail the build
          fail_ci_if_error: false
      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
