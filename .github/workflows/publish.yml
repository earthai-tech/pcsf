name: Publish

# Builds the sdist and the wheel, checks them, publishes them on
# TestPyPI, installs them back from TestPyPI, and only then
# publishes them on PyPI.
#
#   push to master        -> build, check, TestPyPI (smoke test;
#                            a version already there is skipped)
#   tag v*  (e.g. v0.1.0)  -> build, check, TestPyPI, install from
#                            TestPyPI, PyPI
#   manual run             -> build, check, TestPyPI
#
# A tag must match the version in src/pcsf/_version.py.
#
# Publishing uses PyPI trusted publishing (no token in the
# repository). One-time setup, on https://test.pypi.org and on
# https://pypi.org: Account settings > Publishing > Add a pending
# publisher, with
#   PyPI project name: pcsf
#   Owner: earthai-tech, Repository: pcsf
#   Workflow name: publish.yml
#   Environment: testpypi (TestPyPI) and pypi (PyPI)
# and create the environments "testpypi" and "pypi" in Settings >
# Environments (protection rules on "pypi", such as a required
# reviewer, are recommended).

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          version=$(python -c "import re, pathlib; t = pathlib.Path('src/pcsf/_version.py').read_text(); print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', t).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pcsf $version"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match version $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl pytest
          cd /tmp
          /tmp/check/bin/python -c "import pcsf; print(pcsf.__version__)"
          /tmp/check/bin/pcsf --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish on TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pcsf/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI, like PyPI, refuses a version twice
          skip-existing: true

  verify:
    name: install from TestPyPI
    needs: [build, testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pcsf from TestPyPI
        run: |
          version="${{ needs.build.outputs.version }}"
          # TestPyPI may take a minute to list a new version; its
          # dependencies (numpy, h5py) come from PyPI.
          for attempt in 1 2 3 4 5 6; do
            if pip install --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pcsf==$version"; then
              break
            fi
            sleep 30
          done
          python -c "import pcsf; assert pcsf.__version__ == '$version'"
          pcsf --help > /dev/null

  pypi:
    name: publish on PyPI
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pcsf/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
