name: Publish

# Releases pcsf on PyPI, and only from a version tag on master:
#
#   push of a tag v* (e.g. v0.1.0) whose commit is on master
#       -> build and check -> TestPyPI -> install from TestPyPI
#       -> PyPI
#   a tag on another branch, or any other push
#       -> nothing is built or uploaded
#
# Release: set the version in src/pcsf/_version.py on master, then
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match that version.
#
# Uploads use API tokens stored as repository secrets:
#   TEST_PYPI_API_TOKEN  (https://test.pypi.org)
#   PYPI_API_TOKEN       (https://pypi.org)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: tag on master?
    runs-on: ubuntu-latest
    outputs:
      on_master: ${{ steps.check.outputs.on_master }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is the tagged commit on master?
        id: check
        run: |
          git fetch --no-tags origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} is on master: releasing"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is not on master; TestPyPI and PyPI are skipped"
          fi

  build:
    name: build and check
    needs: gate
    if: needs.gate.outputs.on_master == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          version=$(python -c "import re, pathlib; t = pathlib.Path('src/pcsf/_version.py').read_text(); print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', t).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pcsf $version"
      - name: The tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match version $version in src/pcsf/_version.py"
            exit 1
          fi
      - name: Absolute links in the README, for the page on PyPI
        # The README links images and files relative to the
        # repository; PyPI needs URLs, here of the commit published.
        run: python tools/pypi_readme.py README.md "$GITHUB_SHA"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/check/bin/python -c "import pcsf; print(pcsf.__version__)"
          /tmp/check/bin/pcsf --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish on TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pcsf/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # a re-run of the same tag does not fail on TestPyPI
          skip-existing: true

  verify:
    name: install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pcsf from TestPyPI
        run: |
          version="${{ needs.build.outputs.version }}"
          # TestPyPI may take a minute to list a new version; its
          # dependencies (numpy, h5py) come from PyPI.
          for attempt in 1 2 3 4 5 6; do
            if pip install --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "pcsf==$version"; then
              break
            fi
            sleep 30
          done
          python -c "import pcsf; assert pcsf.__version__ == '$version'"
          pcsf --help > /dev/null

  pypi:
    name: publish on PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pcsf/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
