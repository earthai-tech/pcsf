name: Docs

# Builds the documentation (warnings are errors), runs the examples
# of the pages and of the docstrings, and publishes the site on
# GitHub Pages (https://earthai-tech.github.io/pcsf/) from master and
# from release tags. Pull requests and dev only build and check it.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Read the Docs can still build the same site from
# .readthedocs.yaml.

on:
  push:
    branches: [master, dev]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "src/**"
      - "spec/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "spec/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the version of .readthedocs.yaml
          python-version: "3.11"
          cache: pip
      # The optional readers are installed as well: the examples of
      # their docstrings run in the doctest step.
      - name: Install
        run: pip install -e ".[docs,algorithms,emc,mare2dem,schema]"
      - name: Build HTML (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Run the examples
        run: sphinx-build -b doctest docs docs/_build/doctest
      - name: Upload the site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
      - name: Upload the site for GitHub Pages
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/tags/v') ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: publish on GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # one deployment at a time; never cancel one half-way
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
