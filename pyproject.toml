[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsf"
dynamic = ["version"]
description = "Portable Common Subsurface Format: exchange format, tools and algorithms for electromagnetic inversion models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Kouao Laurent Kouadio", email = "etanoyau@gmail.com" }]
keywords = [
    "magnetotellurics", "electromagnetic", "inversion", "resistivity",
    "geophysics", "file format", "HDF5", "interoperability", "Occam2D",
    "ModEM", "MARE2DEM",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# The core reads and writes PCSF (HDF5) and PCSM (text) with numpy and h5py only.
dependencies = [
    "numpy>=1.22",
    "h5py>=3.8",
]

[project.optional-dependencies]
# sampling, registration and comparison of models
algorithms = ["scipy>=1.8", "matplotlib>=3.5"]
# EarthScope / IRIS Earth Model Collaboration netCDF archives
emc = ["netCDF4>=1.6"]
# MARE2DEM meshes (Shewchuk's Triangle)
mare2dem = ["triangle>=20220202"]
# validation against the JSON Schemas of the metadata
schema = ["jsonschema>=4.17"]
# coordinate reference systems
geo = ["pyproj>=3.3"]
# PCSF Studio, the graphical application
studio = ["PySide6>=6.5", "matplotlib>=3.5"]
all = ["pcsf[algorithms,emc,mare2dem,geo,schema,studio]"]
dev = [
    "pcsf[algorithms,emc,mare2dem,geo,schema]",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.5",
    "pre-commit>=3",
]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.6",
    "myst-parser>=2",
    "sphinx-copybutton>=0.5",
    # imported by the pages of PCSF Studio and their examples
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/earthai-tech/pcsf"
Documentation = "https://pcsf.readthedocs.io"
Source = "https://github.com/earthai-tech/pcsf"
Issues = "https://github.com/earthai-tech/pcsf/issues"
Changelog = "https://github.com/earthai-tech/pcsf/blob/master/CHANGELOG.md"

[project.scripts]
pcsf = "pcsf.cli.main:main"

[project.gui-scripts]
pcsf-studio = "pcsf.studio:main"

# Other packages extend pcsf through these entry-point groups
# (see CONTRIBUTING.md and src/pcsf/plugins/__init__.py):
#   pcsf.encodings  -> callable registering resistivity encodings
#   pcsf.adapters   -> callable registering native -> PCSF adapters
#   pcsf.formats    -> callable registering companion formats (boreholes, geology, ...)

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcsf = [
    "py.typed",
    "datasets/*/*",
    "schemas/*.json",
    "studio/resources/*",
]

[tool.setuptools.dynamic]
version = { attr = "pcsf._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests", "src/pcsf"]
addopts = "-ra --doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
filterwarnings = ["error::DeprecationWarning:pcsf.*"]

[tool.ruff]
line-length = 71
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["pcsf"]

[tool.coverage.run]
source = ["pcsf"]
branch = true
